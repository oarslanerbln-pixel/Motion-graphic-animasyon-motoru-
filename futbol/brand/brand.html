<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>
<canvas id="c"></canvas>
<script>
// Kanal kimliği üretici: ?kind=icon|banner|watermark&name=TAKTİK GECE&mono=TG&tag=...
const Q = new URLSearchParams(location.search);
const kind = Q.get('kind') || 'icon', NAME = Q.get('name') || 'TAKTİK GECE', MONO = Q.get('mono') || 'TG', TAG = Q.get('tag') || '';
const SZ = { icon: [800, 800], watermark: [300, 300], banner: [2560, 1440] }[kind];
const [W, H] = SZ, cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const LAT = 'U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD';
const LEX = 'U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF';
let css = ''; for (const [fam, dir, w] of [['Unbounded','unbounded',800],['Unbounded','unbounded',300],['Manrope','manrope',700],['JetBrains Mono','jetbrains-mono',500]])
  for (const [sub, r] of [['latin', LAT], ['latin-ext', LEX]]) css += `@font-face{font-family:'${fam}';font-weight:${w};src:url(../../fonts/fontsource-${dir}/files/${dir}-${sub}-${w}-normal.woff2);unicode-range:${r}}`;
const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
const ACC = '#C9A2FF', ACC2 = '#7FE0F0';
function bg(r) {
  const gr = g.createRadialGradient(W / 2, H * .38, 0, W / 2, H / 2, Math.hypot(W, H) * .6);
  gr.addColorStop(0, '#2B1652'); gr.addColorStop(.55, '#120A26'); gr.addColorStop(1, '#05030B'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const [sx, sd] of [[-.05 * W, 1], [1.05 * W, -1]]) {
    const sy = -.08 * H, ang = Math.atan2(H * .7 - sy, W / 2 - sx), L = Math.hypot(W, H) * 1.4;
    for (const [hw, al] of [[.2, .04], [.1, .06], [.04, .08]]) {
      const lg = g.createLinearGradient(sx, sy, sx + Math.cos(ang) * L * .7, sy + Math.sin(ang) * L * .7);
      lg.addColorStop(0, `rgba(196,170,255,${al})`); lg.addColorStop(1, 'rgba(196,170,255,0)'); g.fillStyle = lg;
      g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(ang - hw) * L, sy + Math.sin(ang - hw) * L); g.lineTo(sx + Math.cos(ang + hw) * L, sy + Math.sin(ang + hw) * L); g.fill();
    }
  }
  g.restore();
}
function glowStroke(fn, col, w) { g.save(); g.strokeStyle = col; g.lineCap = 'round';
  for (const [lw, a] of [[w * 4, .12], [w * 2, .25], [w, 1]]) { g.globalAlpha = a; g.lineWidth = lw; g.beginPath(); fn(); g.stroke(); } g.restore(); }
function emblem(cx, cy, R, withMono = true) {
  // orta yuvarlak + orta çizgi + top: saha merkezinden ilham
  glowStroke(() => g.arc(cx, cy, R, 0, 6.2832), 'rgba(226,214,255,.95)', R * .045);
  glowStroke(() => { g.moveTo(cx, cy - R * 1.32); g.lineTo(cx, cy - R * 1.04); g.moveTo(cx, cy + R * 1.04); g.lineTo(cx, cy + R * 1.32); }, 'rgba(226,214,255,.75)', R * .03);
  const a = -Math.PI * .22, bx = cx + Math.cos(a) * R, by = cy + Math.sin(a) * R;   // top: halkanın üstünde ışıklı nokta
  g.save(); g.globalCompositeOperation = 'lighter'; const rg = g.createRadialGradient(bx, by, 0, bx, by, R * .42);
  rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(.18, 'rgba(201,162,255,.9)'); rg.addColorStop(1, 'rgba(201,162,255,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(bx, by, R * .42, 0, 6.2832); g.fill(); g.restore();
  if (withMono) { g.fillStyle = '#FFFFFF'; g.font = `800 ${R * .78}px Unbounded`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(201,162,255,.6)'; g.shadowBlur = R * .15; g.fillText(MONO, cx, cy + R * .05); g.shadowBlur = 0; }
}
const SAMPLE = "AaZz09·İıŞşĞğÜÖÇ"; Promise.all(["800 40px Unbounded", "300 40px Unbounded", "700 40px Manrope", "500 40px 'JetBrains Mono'"].map(f => document.fonts.load(f, SAMPLE))).then(() => {
  if (kind === 'icon') { bg(); emblem(W / 2, H / 2, W * .27); }
  if (kind === 'watermark') { g.clearRect(0, 0, W, H); g.fillStyle = 'rgba(10,6,22,.55)'; g.beginPath(); g.arc(W / 2, H / 2, W * .48, 0, 6.2832); g.fill(); emblem(W / 2, H / 2, W * .27); }
  if (kind === 'banner') {
    bg();
    // güvenli alan 1546×423 ortada: logo + isim + slogan
    const cy = H / 2; emblem(W / 2 - 520, cy, 120, true);
    g.fillStyle = '#FFFFFF'; g.font = '800 128px Unbounded'; g.textAlign = 'left'; { let s2 = 128; while (g.measureText(NAME).width > 1090 && s2 > 60) { s2 -= 2; g.font = `800 ${s2}px Unbounded`; } } g.textBaseline = 'alphabetic';
    g.shadowColor = 'rgba(201,162,255,.45)'; g.shadowBlur = 30; g.fillText(NAME, W / 2 - 340, cy + 10); g.shadowBlur = 0;
    g.fillStyle = ACC; g.letterSpacing = '5px'; let fs = 36; g.font = `700 ${fs}px Manrope`; const mw = W / 2 + 760 - (W / 2 - 336); while (g.measureText(TAG).width > mw && fs > 18) { fs--; g.font = `700 ${fs}px Manrope`; } g.fillText(TAG, W / 2 - 336, cy + 80);
    // ince saha çizgisi şeridi
    g.strokeStyle = 'rgba(226,214,255,.12)'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, H * .72); g.lineTo(W, H * .72); g.stroke();
  }
  window.DONE = cv.toDataURL('image/png');
});
</script></body></html>
