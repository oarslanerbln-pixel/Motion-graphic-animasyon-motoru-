<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>
<canvas id="c"></canvas>
<script>
// KIRK SEKİZ kimliği — "İ Noktası": serif 48 + altın top; yazı logosunda İ'nin noktası top.
// ?kind=icon|banner|watermark|wordmark
const Q = new URLSearchParams(location.search), kind = Q.get('kind') || 'icon';
const SZ = { icon: [800, 800], watermark: [300, 300], banner: [2560, 1440], wordmark: [1600, 400] }[kind];
const [W, H] = SZ, cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const BG = '#F4EFE6', INK = '#14213D', GOLD = '#B08A3E', MUT = '#5A6275';
const LAT = 'U+0000-00FF,U+0131,U+2000-206F', LEX = 'U+0100-02BA,U+1E00-1E9F';
let css = ''; for (const [fam, dir, w] of [['Playfair Display','playfair-display',900],['Manrope','manrope',800],['Manrope','manrope',700]])
  for (const [sub, r] of [['latin', LAT], ['latin-ext', LEX]]) css += `@font-face{font-family:'${fam}';font-weight:${w};src:url(../../fonts/fontsource-${dir}/files/${dir}-${sub}-${w}-normal.woff2);unicode-range:${r}}`;
const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
function mono(cx, cy, s, ink, gold) {   // serif 48 + top (s = 48'in yazı boyu)
  g.save(); g.fillStyle = ink; g.font = `900 ${s}px 'Playfair Display'`; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.letterSpacing = `${-s * .035}px`;
  const m = g.measureText('48'), capH = m.actualBoundingBoxAscent, r = s * .085;
  // grup (48 + top) sınır kutusuna göre optik ortalama
  const dx0 = m.width / 2 + s * .03, dy0 = -capH / 2 - s * .02;
  const L = -m.width / 2, R = dx0 + r, T = dy0 - r, B = capH / 2;
  const ox = -(L + R) / 2, oy = -(T + B) / 2;
  g.fillText('48', cx + ox, cy + oy + capH / 2);
  g.fillStyle = gold; g.beginPath(); g.arc(cx + ox + dx0, cy + oy + dy0, r, 0, 6.283); g.fill(); g.restore();
}
function word(x, y, fs, ink, gold, align = 'left') {  // KIRK SEK + I + Z, İ noktası top
  g.save(); g.font = `800 ${fs}px Manrope`; const ls = fs * .14; g.letterSpacing = ls + 'px'; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const a = g.measureText('KIRK SEK').width, b = g.measureText('I').width, c = g.measureText('Z').width, tw = a + b + c - ls;
  const x0 = align === 'center' ? x - tw / 2 : x; g.fillStyle = ink;
  g.fillText('KIRK SEK', x0, y); g.fillText('I', x0 + a, y); g.fillText('Z', x0 + a + b, y);
  g.fillStyle = gold; g.beginPath(); g.arc(x0 + a + (b - ls) / 2 - fs * .04, y - fs * .92, fs * .13, 0, 6.283); g.fill(); g.restore(); return tw;
}
const S = 'AaZz09·İıŞşĞğÜÖÇ';
Promise.all(["900 40px 'Playfair Display'", '800 40px Manrope', '700 40px Manrope'].map(f => document.fonts.load(f, S))).then(() => {
  if (kind === 'icon') { g.fillStyle = BG; g.fillRect(0, 0, W, H); mono(W / 2, H / 2, 380, INK, GOLD); }
  if (kind === 'watermark') { g.clearRect(0, 0, W, H); g.fillStyle = 'rgba(244,239,230,.92)'; g.beginPath(); g.arc(W / 2, H / 2, W * .48, 0, 6.283); g.fill(); mono(W / 2, H / 2, 140, INK, GOLD); }
  if (kind === 'wordmark') { g.clearRect(0, 0, W, H); word(W / 2, H / 2 + 50, 140, INK, GOLD, 'center'); }
  if (kind === 'banner') {
    g.fillStyle = BG; g.fillRect(0, 0, W, H);
    // ince saha çizgileri: çok soluk, tüm genişlikte (TV ve masaüstünde görünür)
    g.strokeStyle = 'rgba(20,33,61,.10)'; g.lineWidth = 3; g.strokeRect(160, 260, W - 320, H - 520);
    // güvenli alan 1546×423: monogram + yazı + slogan
    mono(W / 2 - 560, H / 2, 210, INK, GOLD);
    g.fillStyle = INK; g.fillRect(W / 2 - 400, H / 2 - 110, 3, 220);
    word(W / 2 - 340, H / 2 + 20, 104, INK, GOLD);
    g.font = '700 30px Manrope'; g.letterSpacing = '9px'; g.fillStyle = MUT; g.fillText('MAÇTAN 48 SAAT ÖNCE · TARAFSIZ TAKTİK ANALİZ', W / 2 - 336, H / 2 + 98);
  }
  window.DONE = cv.toDataURL('image/png');
});
</script></body></html>
